<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101722"><title>СЕКТОР НОЛЬ — Авторская</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0"></script>
<style>
:root{color-scheme:dark;--bg:#0d131c;--panel:#151f2b;--panel2:#1b2937;--line:#2a3a4b;--muted:#9aabba;--text:#edf3f8;--accent:#d3ad68;--good:#7fc6a4;--bad:#e28e8e}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#1b2b3b 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px}button.primary{background:var(--accent);color:#171717;border-color:var(--accent);font-weight:700}button.danger{border-color:#754747;color:#f1b3b3}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:1180px;margin:auto;padding:28px 18px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:26px}.mark{width:42px;height:42px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:800;letter-spacing:1px;border-radius:12px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;text-transform:uppercase}.brand h1{font-size:19px;margin:0;letter-spacing:2px}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}.panel{background:linear-gradient(145deg,#182431,#121b25);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 16px 50px #0003}.login{max-width:420px;margin:8vh auto}.hidden{display:none!important}.muted{color:var(--muted)}h2{font-size:22px;margin:0 0 5px}h3{font-size:16px;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.layout{display:grid;grid-template-columns:235px 1fr;gap:18px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{text-align:left;background:transparent}.nav button.active{background:#263647;border-color:#496176;color:#fff}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;color:#b6c4d1}.field input,.field textarea,.field select{width:100%;background:#0f1822;border:1px solid #344657;border-radius:9px;padding:11px;color:var(--text);outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.item{padding:14px;border:1px solid var(--line);border-radius:12px;background:#101a24;margin:9px 0}.item strong{display:block}.tag{font-size:11px;border:1px solid #536273;border-radius:30px;padding:3px 8px;color:#c2cfda}.status{font-size:13px;margin-top:12px;color:var(--muted);white-space:pre-wrap}.status.error{color:var(--bad)}.status.ok{color:var(--good)}.section{margin-bottom:24px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.note{border-left:2px solid var(--accent);padding:8px 12px;color:var(--muted);font-size:13px;background:#ffffff06}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.pill{border:1px solid var(--line);border-radius:30px;padding:5px 10px;color:var(--muted);font-size:12px}@media(max-width:760px){.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.grid,.split{grid-template-columns:1fr}.wrap{padding:18px 12px}.panel{padding:16px}}
</style></head><body><div class="wrap">
<header class="brand"><div class="mark">СН</div><div><div class="eyebrow">Закрытый контур</div><h1>СЕКТОР НОЛЬ</h1><p>Авторская мастерская расследований</p></div></header>
<section id="login" class="panel login"><div class="eyebrow">Авторизация</div><h2>Вход для автора</h2><p class="muted">Доступ только для участников авторской команды.</p><form id="loginForm" onsubmit="event.preventDefault()"><div class="field"><label>Электронная почта</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" type="submit" style="width:100%">Войти в мастерскую</button></form><div id="loginStatus" class="status"></div></section>
<section id="app" class="hidden"><div class="topbar"><div><div class="eyebrow">Панель управления</div><div id="welcome" class="muted">Автор</div></div><div class="row"><span id="role" class="pill"></span><button id="logout">Выйти</button></div></div>
<div class="layout"><aside class="panel nav">
<button class="active" data-page="overview">Обзор</button><button data-page="seasons">Сезоны и дела</button><button data-page="characters">Персонажи</button><button data-page="materials">Документы</button><button data-page="evidence">Улики</button><button data-page="puzzles">Загадки</button><button data-page="truth">Скрытая истина</button><button data-page="publish">Проверка и публикация</button>
<div class="note">Публичные материалы и авторская истина хранятся раздельно. Не помещай ответы и секреты в публичные поля.</div></aside>
<main class="panel"><div id="content"></div><div id="status" class="status"></div></main></div></section></div>
<script>
const URL="https://wwmlwgqzzseqauozzolx.supabase.co";
const KEY="sb_publishable_ENyYjXAzC4K-dG2r1Oemsw_9E-entJS";
const sb=window.supabase?.createClient ? window.supabase.createClient(URL,KEY) : null;
let dashboard={seasons:[],cases:[],role:null}, selectedVersion=null, selectedCase=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uuid=()=>crypto.randomUUID();
function msg(text,kind=""){const e=$("status");e.textContent=text;e.className="status "+kind}
async function edge(name,body={}){const {data:{session}}=await sb.auth.getSession();if(!session)throw Error("Сессия завершена. Войдите снова.");const r=await fetch(URL+"/functions/v1/"+name,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||"Ошибка запроса");return j}
async function command(operation,args){return edge("author_command",{operation,args:{p_request_id:uuid(),...args}})}
async function load(){dashboard=await edge("author_dashboard");$("role").textContent=dashboard.role==="owner"?"ВЛАДЕЛЕЦ":"РЕДАКТОР";$("welcome").textContent="Авторская мастерская";$("login").classList.add("hidden");$("app").classList.remove("hidden");render("overview")}
function nav(page){document.querySelectorAll(".nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render(page)}
document.querySelectorAll(".nav button[data-page]").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.page)));
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginStatus").textContent="Проверяем доступ…";try{if(!sb)throw Error("Не загрузилась библиотека авторизации. Обнови страницу; если ошибка повторится, пришли скриншот.");const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)throw error;await load()}catch(x){$("loginStatus").textContent=x.message||"Не удалось войти";$("loginStatus").className="status error"}});
$("logout").onclick=async()=>{await sb.auth.signOut();$("app").classList.add("hidden");$("login").classList.remove("hidden")};
function caseOptions(){return dashboard.cases.map(c=>'<option value="'+esc(c.id)+'">'+esc(c.code+" — "+c.title)+'</option>').join("")}
function seasonOptions(){return dashboard.seasons.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.code+" — "+s.title)+'</option>').join("")}
function render(page){
msg("");
const c=$("content");
if(page==="overview"){c.innerHTML='<div class="eyebrow">Добро пожаловать</div><h2>Рабочее пространство</h2><p class="muted">Здесь создаются и проверяются материалы будущих расследований.</p><div class="grid"><div class="item"><span class="muted">Сезонов</span><h2>'+dashboard.seasons.length+'</h2></div><div class="item"><span class="muted">Дел</span><h2>'+dashboard.cases.length+'</h2></div></div><div class="note">Начни с создания сезона, затем добавь в него дело. Все новые объекты создаются в статусе черновика и не видны игрокам.</div><div class="row" style="margin-top:18px"><button class="primary" onclick="nav(\'seasons\')">Открыть сезоны и дела</button></div>';return}
if(page==="seasons"){c.innerHTML='<div class="eyebrow">Структура проекта</div><h2>Сезоны и дела</h2><div class="grid"><form id="seasonForm" class="item"><h3>Новый сезон</h3><div class="field"><label>Код</label><input name="code" placeholder="season_001" required></div><div class="field"><label>Название</label><input name="title" placeholder="Первый сезон" required></div><div class="field"><label>Номер сезона</label><input name="number" type="number" min="1" value="'+(dashboard.seasons.length+1)+'" required></div><div class="field"><label>Описание</label><textarea name="description"></textarea></div><button class="primary">Создать черновик</button></form><form id="caseForm" class="item"><h3>Новое дело</h3><div class="field"><label>Сезон</label><select name="season" required>'+seasonOptions()+'</select></div><div class="field"><label>Код дела</label><input name="code" placeholder="case_001" required></div><div class="field"><label>Название</label><input name="title" placeholder="Пятый экземпляр" required></div><div class="field"><label>Краткое описание</label><textarea name="description"></textarea></div><button class="primary">Создать дело</button></form></div><h3 style="margin-top:24px">Существующие сезоны</h3>'+dashboard.seasons.map(s=>'<div class="item"><div class="between"><strong>'+esc(s.code+" · "+s.title)+'</strong><span class="tag">'+esc(s.status)+'</span></div><div class="muted">Сезон '+s.season_number+' · '+esc(s.description||"Без описания")+'</div></div>').join("")+'<h3 style="margin-top:24px">Дела</h3>'+dashboard.cases.map(x=>'<div class="item"><div class="between"><strong>'+esc(x.code+" · "+x.title)+'</strong><span class="tag">'+esc(x.status)+'</span></div><div class="muted">'+esc(x.short_description||"Без описания")+'</div><div class="row" style="margin-top:9px">'+(x.case_versions||[]).map(v=>'<button onclick="selectVersion(\''+v.id+'\',\''+x.id+'\')">Версия '+v.version_number+' · '+esc(v.status)+'</button>').join("")+'</div></div>').join("")||'<p class="muted">Пока нет дел.</p>';
$("seasonForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{msg("Создаём сезон…");await command("create_season_draft",{p_code:f.get("code"),p_title:f.get("title"),p_description:f.get("description")||null,p_season_number:Number(f.get("number"))});await refresh();nav("seasons");msg("Черновик сезона создан.","ok")}catch(x){msg(x.message,"error")}};
$("caseForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{msg("Создаём дело…");await command("create_case_draft",{p_season_id:f.get("season"),p_code:f.get("code"),p_title:f.get("title"),p_short_description:f.get("description")||null,p_sort_order:dashboard.cases.length});await refresh();nav("seasons");msg("Черновик дела создан.","ok")}catch(x){msg(x.message,"error")}};return}
if(!selectedVersion){c.innerHTML='<div class="eyebrow">Редактор материалов</div><h2>'+({characters:"Персонажи",materials:"Документы",evidence:"Улики",puzzles:"Загадки",truth:"Скрытая истина",publish:"Проверка и публикация"}[page]||"Редактор")+'</h2><p class="muted">Сначала выбери версию дела в разделе «Сезоны и дела».</p><button onclick="nav(\'seasons\')">Выбрать дело</button>';return}
const head='<div class="eyebrow">Выбрана версия дела</div><h2>'+esc(selectedCase?.title||"Дело")+'</h2><p class="muted">Версия ID: '+esc(selectedVersion)+'</p>';
if(page==="characters"){c.innerHTML=head+'<form id="entityForm"><div class="grid"><div class="field"><label>Код персонажа</label><input name="code" required></div><div class="field"><label>Имя</label><input name="name" required></div></div><div class="field"><label>Публичная роль</label><input name="role"></div><div class="field"><label>Публичное описание</label><textarea name="description"></textarea></div><div class="field"><label>Реальные мотивы (только автор)</label><textarea name="motives" placeholder="Текст или JSON"></textarea></div><div class="field"><label>Секреты (только автор)</label><textarea name="secrets" placeholder="Текст или JSON"></textarea></div><div class="field"><label>Заметки автора</label><textarea name="notes"></textarea></div><button class="primary">Сохранить персонажа</button></form>'; $("entityForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await command("save_character",{p_case_version_id:selectedVersion,p_character_id:null,p_code:f.get("code"),p_name:f.get("name"),p_public_role:f.get("role")||null,p_public_description:f.get("description")||null,p_real_motives:{text:f.get("motives")||""},p_secrets:{text:f.get("secrets")||""},p_private_notes:f.get("notes")||null});msg("Персонаж сохранён.","ok");e.target.reset()}catch(x){msg(x.message,"error")}};return}
if(page==="materials"){c.innerHTML=head+'<form id="entityForm"><div class="grid"><div class="field"><label>Код документа</label><input name="code" required></div><div class="field"><label>Название</label><input name="title" required></div></div><div class="field"><label>Тип</label><select name="type"><option value="document">Документ</option><option value="letter">Письмо</option><option value="report">Отчёт</option><option value="newspaper">Газета</option><option value="photo">Фотография</option><option value="audio">Аудио</option></select></div><div class="field"><label>Публичное содержание (JSON)</label><textarea name="content" required>{ "text": "" }</textarea></div><div class="field"><label>Порядок</label><input name="order" type="number" value="0"></div><label><input name="initial" type="checkbox"> Доступен сразу</label><p><button class="primary">Сохранить документ</button></p></form>'; $("entityForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await command("save_material",{p_case_version_id:selectedVersion,p_material_id:null,p_code:f.get("code"),p_title:f.get("title"),p_material_type:f.get("type"),p_public_content:JSON.parse(f.get("content")),p_sort_order:Number(f.get("order")),p_is_initially_available:f.has("initial")});msg("Документ сохранён.","ok");e.target.reset()}catch(x){msg(x.message,"error")}};return}
if(page==="evidence"){c.innerHTML=head+'<form id="entityForm"><div class="grid"><div class="field"><label>Код улики</label><input name="code" required></div><div class="field"><label>Название</label><input name="title" required></div></div><div class="field"><label>Описание для игрока</label><textarea name="description" required></textarea></div><div class="field"><label>Тип улики</label><input name="type" placeholder="physical, testimony, digital…"></div><button class="primary">Сохранить улику</button></form>'; $("entityForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await command("save_evidence",{p_case_version_id:selectedVersion,p_evidence_id:null,p_code:f.get("code"),p_title:f.get("title"),p_public_description:f.get("description"),p_evidence_type:f.get("type")||null});msg("Улика сохранена.","ok");e.target.reset()}catch(x){msg(x.message,"error")}};return}
if(page==="puzzles"){c.innerHTML=head+'<form id="entityForm"><div class="grid"><div class="field"><label>Код загадки</label><input name="code" required></div><div class="field"><label>Название</label><input name="title" required></div></div><div class="field"><label>Условие для игрока</label><textarea name="question" required></textarea></div><div class="grid"><div class="field"><label>Тип ответа</label><select name="type"><option value="text">Текст</option><option value="number">Число</option></select></div><div class="field"><label>Максимум подсказок</label><input name="hints" type="number" min="0" value="2"></div></div><div class="field"><label>Принимаемые ответы (JSON-массив строк)</label><textarea name="answers" required>["ответ"]</textarea></div><div class="field"><label>Объяснение ответа (авторское)</label><textarea name="explanation"></textarea></div><div class="field"><label>Подсказка 1</label><textarea name="hint1"></textarea></div><div class="field"><label>Подсказка 2</label><textarea name="hint2"></textarea></div><button class="primary">Сохранить загадку и ответ</button></form>'; $("entityForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const p=await command("save_puzzle",{p_case_version_id:selectedVersion,p_puzzle_id:null,p_code:f.get("code"),p_title:f.get("title"),p_public_question:f.get("question"),p_answer_type:f.get("type"),p_normalization_rule:{trim:true,case_insensitive:true},p_max_hint_level:Number(f.get("hints")),p_sort_order:0,p_is_initially_available:false});const id=p.result?.puzzle_id||p.result?.id||p.result?.puzzle?.id;if(!id)throw Error("Загадка создана, но сервер не вернул её ID. Ответы добавим после проверки результата.");await command("save_puzzle_answer",{p_case_version_id:selectedVersion,p_puzzle_id:id,p_accepted_answers:JSON.parse(f.get("answers")),p_answer_explanation:f.get("explanation")||null,p_validation_config:{}});if(f.get("hint1"))await command("save_puzzle_hint",{p_case_version_id:selectedVersion,p_puzzle_id:id,p_level:1,p_hint_text:f.get("hint1")});if(f.get("hint2"))await command("save_puzzle_hint",{p_case_version_id:selectedVersion,p_puzzle_id:id,p_level:2,p_hint_text:f.get("hint2")});msg("Загадка, ответ и подсказки сохранены.","ok");e.target.reset()}catch(x){msg(x.message,"error")}};return}
if(page==="truth"){c.innerHTML=head+'<div class="note">Авторская истина редактируется отдельными сущностями: события, связи событий и объяснения. Сначала проверим точные поля и контракты этих форм, чтобы не допустить утечки секретов в публичные материалы.</div><p><button class="primary" onclick="nav(\'publish\')">Перейти к проверке дела</button></p>';return}
if(page==="publish"){c.innerHTML=head+'<p class="muted">Проверка выполняется сервером. Публикация доступна только владельцу.</p><div class="row"><button id="validate" class="primary">Проверить готовность</button><button id="report">Проверить вопросы отчёта</button><button id="rubric">Проверить критерии оценки</button>'+(dashboard.role==="owner"?'<button id="publish" class="danger">Опубликовать версию</button>':"")+'</div>'; $("validate").onclick=async()=>{try{const r=await command("validate_case_version_for_publish",{p_case_version_id:selectedVersion});msg(JSON.stringify(r.result,null,2),"ok")}catch(x){msg(x.message,"error")}};$("report").onclick=async()=>{try{const r=await command("validate_final_report_contract",{p_case_version_id:selectedVersion});msg(JSON.stringify(r.result,null,2),"ok")}catch(x){msg(x.message,"error")}};$("rubric").onclick=async()=>{try{const r=await command("validate_solution_rubric",{p_case_version_id:selectedVersion});msg(JSON.stringify(r.result,null,2),"ok")}catch(x){msg(x.message,"error")}};if($("publish"))$("publish").onclick=async()=>{if(!confirm("Опубликовать эту версию? Игроки смогут получить доступ к публичным материалам."))return;try{const r=await command("publish_case_version",{p_case_version_id:selectedVersion});msg(JSON.stringify(r.result,null,2),"ok");await refresh()}catch(x){msg(x.message,"error")}};return}
}
async function refresh(){dashboard=await edge("author_dashboard")}
window.nav=nav;window.selectVersion=(v,cid)=>{selectedVersion=v;selectedCase=dashboard.cases.find(x=>x.id===cid);nav("characters")};
</script></body></html>
