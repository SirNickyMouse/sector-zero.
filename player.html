<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101722"><title>СЕКТОР НОЛЬ — Расследование</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.js" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2.57.0/dist/umd/supabase.js';this.onerror=()=>{window.__supabaseLoadFailed=true;};"></script>
<style>
:root{color-scheme:dark;--bg:#0c121a;--panel:#151f2b;--panel2:#1c2a38;--line:#304254;--muted:#9eafbd;--text:#edf3f8;--gold:#d3ad68;--green:#8ac9a8;--red:#e39a9a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#1c2d3e 0,transparent 40%),var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px}button.primary{background:var(--gold);color:#171717;border-color:var(--gold);font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}input,textarea,select{width:100%;background:#0e1721;border:1px solid var(--line);border-radius:9px;padding:11px;color:var(--text)}textarea{min-height:100px;resize:vertical}.wrap{max-width:1180px;margin:auto;padding:26px 16px}.brand{display:flex;gap:13px;align-items:center;margin-bottom:22px}.mark{width:42px;height:42px;border:1px solid var(--gold);border-radius:12px;display:grid;place-items:center;color:var(--gold);font-weight:800}.eyebrow{color:var(--gold);font-size:11px;letter-spacing:2px;text-transform:uppercase}.brand h1{font-size:19px;margin:0;letter-spacing:2px}.brand p{font-size:12px;color:var(--muted);margin:0}.panel{background:linear-gradient(145deg,#182431,#121b25);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 16px 50px #0003}.login{max-width:420px;margin:8vh auto}.hidden{display:none!important}.muted{color:var(--muted)}h2{font-size:23px;margin:0 0 7px}h3{font-size:17px;margin:0 0 12px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;color:#b9c7d3}.layout{display:grid;grid-template-columns:210px 1fr;gap:16px}.nav{display:flex;flex-direction:column;gap:6px;align-self:start}.nav button{text-align:left;background:transparent}.nav button.active{background:#26394b;border-color:#4d657a}.item{padding:14px;border:1px solid var(--line);border-radius:12px;background:#101a24;margin:10px 0}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:11px;border:1px solid #536273;border-radius:30px;padding:3px 8px;color:#c2cfda}.status{white-space:pre-wrap;margin-top:12px;color:var(--muted);font-size:13px}.status.error{color:var(--red)}.status.ok{color:var(--green)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.note{border-left:2px solid var(--gold);padding:9px 12px;color:var(--muted);background:#ffffff06;font-size:13px}.content{white-space:pre-wrap;overflow-wrap:anywhere}.question{border-top:1px solid var(--line);padding:14px 0}.choice{display:flex;gap:9px;align-items:flex-start;margin:8px 0}.choice input{width:auto;margin-top:4px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.document{max-width:850px}.small{font-size:12px;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.wrap{padding:16px 10px}.panel{padding:15px}}
</style>
</head>
<body><div class="wrap">
<header class="brand"><div class="mark">СН</div><div><div class="eyebrow">Архив расследований</div><h1>СЕКТОР НОЛЬ</h1><p>Ничего не принимай на веру. Сверяй факты.</p></div></header>
<section id="login" class="panel login"><div class="eyebrow">Личный кабинет</div><h2>Вход в расследование</h2><p class="muted">Войди, чтобы начать дело или продолжить сохранённое расследование.</p>
<div id="loginForm"><div class="field"><label>Электронная почта</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginButton" class="primary" type="button" style="width:100%">Войти</button></div><div class="row" style="margin-top:12px"><button id="createAccount" type="button">Создать аккаунт</button></div><div id="loginStatus" class="status"></div></section>
<section id="app" class="hidden">
<div class="top"><div><div class="eyebrow">Игровое дело</div><div id="caseName" class="muted">Выбери расследование</div></div><div class="row"><span id="userLabel" class="tag">Игрок</span><button id="logout">Выйти</button></div></div>
<div id="catalog" class="panel"><h2>Доступные дела</h2><p id="catalogLoading" class="muted">Загружаем опубликованные расследования…</p><div id="cases"></div><div id="catalogStatus" class="status"></div></div>
<div id="workspace" class="hidden layout" style="margin-top:16px">
<aside class="panel nav">
<button class="active" data-page="overview">Досье</button><button data-page="stages">Этапы расследования</button><button data-page="documents">Документы</button><button data-page="characters">Персонажи</button><button data-page="evidence">Улики</button><button data-page="puzzles">Загадки</button><button data-page="notes">Заметки</button><button data-page="hypotheses">Версии</button><button data-page="links">Связи</button><button data-page="report">Итоговое заключение</button>
<button id="backCatalog">К списку дел</button>
</aside><main class="panel"><div id="pageContent"></div><div id="status" class="status"></div></main>
</div></section></div>
<script>
const SUPABASE_URL="https://wwmlwgqzzseqauozzolx.supabase.co";
const KEY="sb_publishable_ENyYjXAzC4K-dG2r1Oemsw_9E-entJS";
const $=id=>document.getElementById(id);
if(!window.supabase?.createClient){const box=$("loginStatus");if(box){box.textContent="Модуль авторизации не загрузился. Проверь подключение к интернету и попробуй позже.";box.className="status error";}throw new Error("Supabase JS library failed to load");}
const sb=window.supabase.createClient(SUPABASE_URL,KEY);
window.addEventListener("error",e=>{const box=$("loginStatus");if(box&&!box.textContent){box.textContent="Ошибка запуска страницы: "+(e.message||"неизвестная ошибка");box.className="status error";}});
const uid=()=>crypto.randomUUID();
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let catalog=null,state=null,materialCatalog=[],investigationId=null,caseVersionId=null,activePage="overview",reportId=null,reportAnswers={};
function status(t,k=""){ $("status").textContent=t||"";$("status").className="status "+k; }
async function edge(name,body={}) {
 const {data:{session}}=await sb.auth.getSession();if(!session)throw Error("Сессия завершена. Войдите снова.");
 const r=await fetch(SUPABASE_URL+"/functions/v1/"+name,{method:"POST",headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+session.access_token},body:JSON.stringify(body)});
 const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.error?.message||j.error?.code||"Ошибка запроса");return j;
}
async function refreshCatalog(){
 catalog=await edge("player_catalog");
 $("catalogLoading").classList.add("hidden");
 const list=[];
 for(const s of catalog.seasons||[])for(const c of s.cases||[])for(const v of c.versions||[])list.push({season:s,case:c,version:v});
 $("cases").innerHTML=list.length?list.map(x=>'<article class="item"><div class="eyebrow">Сезон '+esc(x.season.season_number)+' · '+esc(x.case.code)+'</div><h3>'+esc(x.case.title)+'</h3><p class="muted">'+esc(x.case.short_description||"Описание пока не добавлено.")+'</p><button class="primary" data-start="'+esc(x.version.id)+'">Начать расследование</button></article>').join(""):'<div class="note">Пока нет опубликованных дел. Черновики автора здесь не отображаются.</div>';
 $("cases").querySelectorAll("[data-start]").forEach(b=>b.onclick=()=>startCase(b.dataset.start));
 const active=(catalog.investigations||[])[0];
 if(active){const found=list.find(x=>x.version.id===active.case_version_id);$("cases").insertAdjacentHTML("afterbegin",'<article class="item"><div class="eyebrow">Продолжить</div><h3>'+esc(active.title||found?.case.title||"Моё расследование")+'</h3><button class="primary" id="resume">Продолжить расследование</button></article>');$("resume").onclick=()=>openInvestigation(active.id,active.case_version_id);}
}
async function startCase(versionId){
 try{ $("catalogStatus").textContent="Открываем новое дело…";const r=await edge("start_investigation",{case_version_id:versionId,request_id:uid()});await openInvestigation(r.investigation_id,versionId);}
 catch(e){$("catalogStatus").textContent=e.message;}
}
async function openInvestigation(id,versionId){
 investigationId=id;caseVersionId=versionId;
 try{await loadState();$("catalog").classList.add("hidden");$("workspace").classList.remove("hidden");render("overview");}
 catch(e){status(e.message,"error");}
}
async function loadState(){
 const r=await edge("get_investigation_state",{investigation_id:investigationId});state=r;
 // Submitted investigations are read-only: retain the already loaded catalogs
 // and do not call active-only material/evidence endpoints after submission.
 if(r.investigation?.status==="active"){
  const m=await edge("player_material_catalog",{investigation_id:investigationId});materialCatalog=m.materials||[];
  const ev=await edge("player_evidence_catalog",{investigation_id:investigationId});state.evidence=ev.evidence||[];
 }else{
  materialCatalog=materialCatalog||[];
  state.evidence=state.evidence||[];
 }
 $("caseName").textContent=r.case.title+" · "+r.season.title;
 const reportNav=document.querySelector('.nav [data-page="report"]');
 if(reportNav){const unlocked=!r.stage_state||r.stage_state.final_unlocked;reportNav.disabled=!unlocked;reportNav.textContent=unlocked?"Итоговое заключение":"Итоговое заключение · закрыто";}
 const reportRows=(r.final_reports||[]).slice().reverse();reportId=reportRows.find(x=>x.status==="draft")?.id||reportRows[0]?.id||uid();
 const existing=(r.final_reports||[]).find(x=>x.id===reportId);reportAnswers={};(existing?.answers||[]).forEach(a=>reportAnswers[a.question_code]=a.answer);
}
function nav(page){if(page==="report"&&state?.stage_state&&!state.stage_state.final_unlocked){status("Финальный этап пока закрыт. Сначала выполни условия расследования.","error");return;}activePage=page;document.querySelectorAll(".nav [data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render(page);}
document.querySelectorAll(".nav [data-page]").forEach(b=>b.onclick=()=>nav(b.dataset.page));
$("backCatalog").onclick=()=>{$("workspace").classList.add("hidden");$("catalog").classList.remove("hidden");};
function render(page){
 status("");const c=$("pageContent");
 if(page==="overview"){const current=state.stage_state?.current_stage;const progress=state.stage_state||{};c.innerHTML='<div class="eyebrow">Личное дело</div><h2>'+esc(state.case.title)+'</h2><p class="muted">'+esc(state.case.short_description||"Расследование начато.")+'</p><div class="item"><div class="eyebrow">Текущий этап</div><h3>'+esc(current?.title||(progress.final_unlocked?"Можно оформить итоговое заключение":"Расследование продолжается"))+'</h3><p class="muted">'+esc(current?.description||"Следи за условиями открытия следующих этапов.")+'</p><div class="small">Обязательные этапы: '+(progress.completed_required_stage_count||0)+' / '+(progress.required_stage_count||0)+' завершено</div></div><div class="grid"><div class="item"><span class="small">Открыто документов</span><h2>'+state.opened_materials.length+'</h2></div><div class="item"><span class="small">Загадок в деле</span><h2>'+state.puzzles.length+'</h2></div><div class="item"><span class="small">Заметок</span><h2>'+state.notes.length+'</h2></div><div class="item"><span class="small">Версий</span><h2>'+state.hypotheses.length+'</h2></div></div><div class="note">Записывай не только вывод, но и степень уверенности. Отсутствие записи само по себе ещё не доказывает, что события не было.</div>';return;}
 if(page==="stages"){const progress=state.stage_state||{};const stages=progress.stages||[];const labels={completed:"Завершён",available:"Доступен",locked:"Закрыт"};c.innerHTML='<div class="eyebrow">Ход расследования</div><h2>Этапы расследования</h2><p class="muted">Этапы открываются по выполнению игровых условий. Внутри доступного этапа ты можешь выбирать порядок действий самостоятельно.</p><div class="item"><strong>Прогресс обязательных этапов</strong><div class="small">'+(progress.completed_required_stage_count||0)+' из '+(progress.required_stage_count||0)+' завершено</div></div>'+stages.map(s=>'<article class="item"><div class="between"><strong>'+esc(s.title)+'</strong><span class="tag">'+(labels[s.status]||"Неизвестно")+'</span></div><p class="muted">'+esc(s.description||"")+'</p>'+(s.is_final&&s.status==="available"?"<p class='small'>Финальное заключение теперь доступно.</p>":"")+'</article>').join("")||'<p class="muted">Для этого дела этапы ещё не настроены.</p>';return;}
 if(page==="documents"){
 const opened=new Set(state.opened_materials.map(x=>x.state.material_id));
 c.innerHTML='<div class="eyebrow">Материалы дела</div><h2>Документы</h2><p class="muted">Документ открывается только после выполнения серверных условий.</p>'+materialCatalog.map(m=>'<article class="item"><div class="between"><strong>'+esc(m.code ? m.code+' · '+m.title : m.title)+'</strong><span class="tag">'+(m.is_opened?"Открыт":m.is_available?"Доступен":"Закрыт")+'</span></div>'+(m.material_type?'<div class="small">'+esc(m.material_type)+'</div>':"")+ '<div class="row" style="margin-top:9px">'+(m.is_opened?'<button data-view="'+m.id+'">Читать документ</button>':m.is_available?'<button class="primary" data-open="'+m.id+'">Открыть</button>':'<button disabled>Пока недоступен</button>')+'</div><div id="doc-'+m.id+'"></div></article>').join("")||'<p class="muted">Документов пока нет.</p>';
 c.querySelectorAll("[data-open]").forEach(b=>b.onclick=async()=>{try{status("Проверяем доступ…");await edge("open_material",{investigation_id:investigationId,material_id:b.dataset.open});await loadState();render("documents");status("Документ открыт.","ok");}catch(e){status(e.message,"error");}});
 c.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{const m=state.opened_materials.find(x=>x.state.material_id===b.dataset.view)?.material;const el=$("doc-"+b.dataset.view);el.innerHTML='<div class="item document"><div class="content">'+esc(JSON.stringify(m?.public_content??{},null,2))+'</div></div>';});
 return;}
 if(page==="characters"){c.innerHTML='<div class="eyebrow">Участники дела</div><h2>Персонажи</h2>'+(state.characters||[]).map(x=>'<article class="item"><h3>'+esc(x.name)+'</h3><div class="tag">'+esc(x.public_role||"")+'</div><p class="muted">'+esc(x.public_description||"")+'</p></article>').join("")||'<p class="muted">Список пока пуст.</p>';return;}
 if(page==="evidence"){c.innerHTML='<div class="eyebrow">Собранные доказательства</div><h2>Улики</h2><p class="muted">Улики появляются здесь после открытия документов, в которых они обнаружены.</p>'+(state.evidence||[]).map(e=>'<article class="item"><div class="eyebrow">'+esc(e.code)+' · '+esc(e.evidence_type||"Материал")+'</div><h3>'+esc(e.title)+'</h3><p>'+esc(e.public_description)+'</p>'+e.found_in.map(x=>'<div class="small">Источник: '+esc(x.material_title||"Документ")+(x.context_note?' — '+esc(x.context_note):"")+'</div>').join("")+'</article>').join("")||'<p class="muted">Пока не обнаружено ни одной улики.</p>';return;}
 if(page==="puzzles"){c.innerHTML='<div class="eyebrow">Проверка фактов</div><h2>Загадки</h2>'+(state.puzzles||[]).map(x=>'<article class="item"><div class="between"><h3>'+esc(x.puzzle?.title||"Загадка")+'</h3><span class="tag">'+esc(x.state.status)+'</span></div><p>'+esc(x.puzzle?.public_question||"")+'</p>'+(x.state.status==="solved"?"<p class='small'>Решено</p>":x.state.status==="locked"?"<p class='small'>Сначала изучи связанные материалы.</p>":'<form data-puzzle="'+x.state.puzzle_id+'"><div class="field"><label>Твой ответ</label><input name="answer" maxlength="2000" required></div><div class="row"><button class="primary">Проверить ответ</button><button type="button" data-hint="'+x.state.puzzle_id+'">Подсказка</button></div></form>')+'<div class="small">'+(x.state.attempts_count||0)+' попыток · подсказок: '+(x.state.hints_used||0)+'</div></article>').join("")||'<p class="muted">Загадок пока нет.</p>';
 c.querySelectorAll("[data-puzzle]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();try{const a=new FormData(f).get("answer");const r=await edge("submit_puzzle_answer",{investigation_id:investigationId,puzzle_id:f.dataset.puzzle,request_id:uid(),answer:a});await loadState();render("puzzles");status(r.result?.correct?"Верно! Загадка решена.":"Пока неверно. Сверь ответ с материалами и попробуй ещё раз.",r.result?.correct?"ok":"");}catch(x){status(x.message,"error");}});
 c.querySelectorAll("[data-hint]").forEach(b=>b.onclick=async()=>{try{const r=await edge("request_hint",{investigation_id:investigationId,puzzle_id:b.dataset.hint,request_id:uid()});await loadState();render("puzzles");status(r.hint?.hint_text||JSON.stringify(r.hint),"ok");}catch(x){status(x.message,"error");}});
 return;}
 if(page==="notes"){c.innerHTML='<div class="eyebrow">Рабочие записи</div><h2>Заметки</h2><form id="noteForm" class="item"><div class="field"><label>Заголовок</label><input name="title" maxlength="160"></div><div class="field"><label>Заметка</label><textarea name="body" required maxlength="20000"></textarea></div><div class="field"><label>Связать с открытым документом</label><select name="material"><option value="">Без привязки</option>'+state.opened_materials.map(x=>'<option value="'+x.state.material_id+'">'+esc(x.material?.title||x.material?.code)+'</option>').join("")+'</select></div><button class="primary">Сохранить заметку</button></form>'+state.notes.map(n=>'<article class="item"><strong>'+esc(n.title||"Без заголовка")+'</strong><p class="content">'+esc(n.body)+'</p><div class="small">Редакций: '+(n.revisions?.length||0)+'</div>'+(n.revisions?.length?'<details><summary>История заметки</summary>'+n.revisions.map(r=>'<div class="note"><strong>Редакция '+r.revision_number+' · '+esc(r.action)+'</strong><p>'+esc(r.title||"Без заголовка")+'</p><p class="content">'+esc(r.body||"")+'</p></div>').join("")+'</details>':"")+'</article>').join("");$("noteForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await edge("save_note",{investigation_id:investigationId,note_id:uid(),request_id:uid(),action:"save",title:f.get("title"),body:f.get("body"),related_material_id:f.get("material")||null});await loadState();render("notes");status("Заметка сохранена.","ok");}catch(x){status(x.message,"error");}};return;}
 if(page==="hypotheses"){c.innerHTML='<div class="eyebrow">Рабочие версии</div><h2>Гипотезы</h2><form id="hypForm" class="item"><div class="field"><label>Название версии</label><input name="title" maxlength="160" required></div><div class="field"><label>Содержание версии</label><textarea name="text" maxlength="10000" required></textarea></div><div class="field"><label>Почему меняешь или создаёшь эту версию?</label><input name="note" maxlength="1000"></div><button class="primary">Сохранить новую версию</button></form>'+state.hypotheses.map(h=>'<article class="item"><div class="between"><strong>'+esc(h.title)+'</strong><span class="tag">'+esc(h.status)+'</span></div><p class="content">'+esc(h.current_text)+'</p><div class="small">Редакция '+h.current_revision_number+' · история: '+(h.revisions?.length||0)+'</div><button type="button" data-revise="'+h.id+'">Добавить редакцию</button>'+(h.revisions?.length?'<details><summary>Полная история версии</summary>'+h.revisions.map(r=>'<div class="note"><strong>Редакция '+r.revision_number+' · '+esc(r.action)+'</strong><p>'+esc(r.title||"")+'</p><p class="content">'+esc(r.hypothesis_text||"")+'</p><p class="small">'+esc(r.change_note||"")+'</p></div>').join("")+'</details>':"")+'<form class="hidden item" data-revise-form="'+h.id+'"><div class="field"><label>Название</label><input name="title" maxlength="160" value="'+esc(h.title)+'" required></div><div class="field"><label>Новая редакция</label><textarea name="text" maxlength="10000" required>'+esc(h.current_text)+'</textarea></div><div class="field"><label>Что изменилось и почему?</label><input name="note" maxlength="1000"></div><button class="primary">Сохранить редакцию</button></form></article>').join("");$("hypForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{await edge("save_hypothesis_revision",{investigation_id:investigationId,hypothesis_id:uid(),request_id:uid(),action:"create",title:f.get("title"),hypothesis_text:f.get("text"),status:"activ
